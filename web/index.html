<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlanCraft Pro AI — AI-assisted 2D/3D floor plan architect, 100% offline.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PlanCraft Pro AI">

  <meta name="theme-color" content="#05050A">
  <title>PlanCraft Pro AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /* Dark boot background so there's no white flash before Flutter paints */
    html, body {
      background: #05050A;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05050A;
      z-index: 9999;
    }
    #boot-loader .ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(0,245,255,0.15);
      border-top-color: #00F5FF;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 18px rgba(0,245,255,0.55);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-loader"><div class="ring"></div></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
