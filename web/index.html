<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PlanCraft Pro AI — AI-assisted 2D/3D floor plan architect, 100% offline.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PlanCraft Pro AI">

  <meta name="theme-color" content="#05050A">
  <title>PlanCraft Pro AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      background: #05050A;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05050A;
      z-index: 9999;
    }
    #boot-loader .ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(0,245,255,0.15);
      border-top-color: #00F5FF;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 18px rgba(0,245,255,0.55);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="ring"></div>
    <div id="boot-diag" style="position:absolute; bottom:40px; left:16px; right:16px; color:#7CFFF5; font-family:monospace; font-size:11px; text-align:center; white-space:pre-wrap;"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (names) {
        names.forEach(function (n) { caches.delete(n); });
      }).catch(function () {});
    }

    function showDiag(msg) {
      var d = document.getElementById('boot-diag');
      if (d) d.textContent = (d.textContent ? d.textContent + '\n' : '') + msg;
    }
    window.addEventListener('error', function (e) {
      showDiag('ERROR: ' + (e.message || e.error) + (e.filename ? ' @ ' + e.filename : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showDiag('PROMISE REJECTED: ' + e.reason);
    });
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) loader.remove();
    });
    setTimeout(function () {
      var loader = document.getElementById('boot-loader');
      if (loader && document.getElementById('flt-glass-pane') == null) {
        showDiag('Flutter did not render within 12s.\nCheck network access to gstatic.com (CanvasKit) and check that all build/web files uploaded correctly.');
      }
    }, 12000);
  </script>
</body>
</html>
